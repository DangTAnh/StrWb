<nav class="nav-group">
  <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Mở trình đơn">
  <label for="nav-toggle" class="nav-toggle__btn">
    <span class="nav-toggle__icon"></span>
    <span class="nav-toggle__icon"></span>
    <span class="nav-toggle__icon"></span>
  </label>
  <div class="site-nav">
    <a class="rounded-s-lg border-x-4" href="{{ url_for('public.home') }}">Trang chủ</a>
    <a class="border-x-4" href="{{ url_for('admin.products') }}">Sản phẩm</a>
    <a class="border-x-4" href="{{ url_for('admin.categories') }}">Danh mục</a>
    <a class="border-x-4" href="{{ url_for('admin.orders') }}">Đơn hàng</a>
    <a class="rounded-s-lg border-x-4" href="{{ url_for('admin.stats') }}">Thống kê</a>
    <a class="mobile-menu-cart rounded-s-lg border-x-4" href="{{ url_for('public.cart') }}">Giỏ hàng
      {% with cart_count = cart_total_quantity %}
        {% if cart_count > 0 %}
        <span class="cart-badge inline-block ml-1 px-2 h-5 bg-accent text-white text-xs font-semibold rounded-full">{{ cart_count }}</span>
        {% else %}
        <span class="cart-badge hidden inline-block ml-1 px-2 h-5 bg-accent text-white text-xs font-semibold rounded-full">0</span>
        {% endif %}
      {% endwith %}
    </a>
    <form class="mobile-menu-logout" method="post" action="{{ url_for('auth.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" id="logout-button-menu" class="btn btn-secondary w-full">Đăng xuất</button>
    </form>
  </div>
</nav>
