{% extends "base.html" %}
{% block content %}
<div class="admin-card">
  <h1>Xin chào, {{ current_user.username }}</h1>
  <nav class="nav-list">
    <a href="{{ url_for('admin.dashboard') }}">Trang chủ</a>
    <div class="nav-group">
      <a href="{{ url_for('admin.dashboard') }}">Sản phẩm</a>
      <span class="badge">Chưa có sản phẩm</span>
    </div>
    <div class="nav-group logout-form">
      <form method="post" action="{{ url_for('auth.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Đăng xuất</button>
      </form>
    </div>
  </nav>
  <p>Danh sách sản phẩm sẽ xuất hiện ở đây sau Phase 2.</p>
</div>
{% endblock %}
