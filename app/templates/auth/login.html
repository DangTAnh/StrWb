{% extends "base.html" %}
{% block content %}
<div class="login-wrapper">
  <div class="login-card">
    <h1>Đăng nhập quản trị</h1>
    <form method="post" action="{{ url_for('auth.login') }}">
      {{ form.hidden_tag() }}
      {{ form.username.label }}
      {{ form.username() }}
      {{ form.password.label }}
      {{ form.password() }}
      {{ form.submit() }}
    </form>
  </div>
</div>
{% endblock %}
