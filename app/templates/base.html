<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Quản lý hàng{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Bỏ qua đến nội dung chính</a>
  {% block header %}{% endblock %}
  <main id="main-content">
    {% block content %}{% endblock %}
  </main>
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
  <footer class="site-footer">© {{ current_year }} Quản lý hàng</footer>
  <script>
    // Global toast helper: JS-triggered toasts + flash toasts (same DOM/CSS).
    // Type: 'success' (default), 'error', 'info'. Auto-dismiss sau 4.5s.
    window.showToast = function (message, type) {
      var container = document.getElementById('toast-container');
      if (!container) return;
      var el = document.createElement('div');
      var cls = 'toast';
      if (type === 'error') cls += ' toast-error';
      else if (type === 'success') cls += ' toast-success';
      else cls += ' toast-info';
      el.className = cls;
      el.textContent = message;
      container.appendChild(el);
      // Force reflow trước khi add 'show' để trigger CSS transition.
      void el.offsetWidth;
      el.classList.add('show');
      setTimeout(function () {
        el.classList.remove('show');
        el.classList.add('hide');
        el.addEventListener('transitionend', function () { el.remove(); });
      }, 4500);
    };
  </script>
  {% set toasts = get_flashed_messages(with_categories=true) %}
  {% if toasts %}
  <script id="flashed-toasts" type="application/json">{{ toasts | tojson }}</script>
  <script>
    (function () {
      var el = document.getElementById('flashed-toasts');
      if (!el) return;
      var toasts = JSON.parse(el.textContent);
      toasts.forEach(function (t) {
        window.showToast(t[1], t[0] === 'error' ? 'error' : t[0] === 'success' ? 'success' : 'info');
      });
    })();
  </script>
  {% endif %}
</body>
</html>
