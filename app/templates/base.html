<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Quản lý hàng{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+VN:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="font-sans text-text bg-bg">
  <a class="skip-link absolute left-[-9999px] top-0 p-2 bg-card z-50 focus:left-0" href="#main-content">Bỏ qua đến nội dung chính</a>
  {% block header %}{% endblock %}
  <main id="main-content">
    {% block content %}{% endblock %}
  </main>
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
  <footer class="container mx-auto px-4 py-8 text-center text-sm text-text-muted">© {{ current_year }} Quản lý hàng</footer>
  {% set toasts = get_flashed_messages(with_categories=true) %}
  {% if toasts %}
  <script>
    (function (toasts) {
      toasts.forEach(function (t) {
        var el = document.createElement('div');
        el.className = 'toast ' + (t[0] === 'error' ? 'toast-error' : t[0] === 'success' ? 'toast-success' : '');
        el.textContent = t[1];
        document.getElementById('toast-container').appendChild(el);
        el.classList.add('show');
        setTimeout(function () { el.classList.remove('show'); el.classList.add('hide'); el.addEventListener('transitionend', function () { el.remove(); }); }, 4500);
      });
    })({{ toasts | tojson }});
  </script>
  {% endif %}
</body>
</html>
