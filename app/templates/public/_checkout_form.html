{# Partial: 3 ô input + note + submit. Được include bên trong #checkout-form (parent form), KHÔNG có <form> bao ngoài để tránh nested form. CSRF + honeypot đã có ở form cha. #}
<div class="checkout-form">
  <div class="form-field">
    <label for="customer_name">Họ và tên</label>
    <input type="text" id="customer_name" name="customer_name" maxlength="100" />
  </div>
  <div class="form-field">
    <label for="customer_phone">Số điện thoại</label>
    <input type="tel" id="customer_phone" name="customer_phone" />
    <p class="help-text">8–11 chữ số, có thể có dấu cách, gạch ngang hoặc dấu cộng</p>
  </div>
  <div class="form-field">
    <label for="customer_address">Địa chỉ</label>
    <textarea id="customer_address" name="customer_address" maxlength="500"></textarea>
  </div>
  <div class="form-field">
    <label for="customer_note">Ghi chú (tùy chọn)</label>
    <textarea id="customer_note" name="customer_note" maxlength="1000" placeholder="Ví dụ: giao sau 18h, gọi trước khi đến..."></textarea>
  </div>
  <div class="form-field">
    <button type="submit" class="btn btn-primary">Đặt hàng</button>
  </div>
</div>
