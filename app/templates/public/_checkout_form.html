<form class="checkout-form grid gap-4" method="post" action="{{ url_for('public.checkout') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="text" name="website" class="honeypot" autocomplete="off" tabindex="-1" aria-hidden="true">
  <div class="form-field">
    <label for="customer_name" class="block text-sm font-medium text-text mb-1">Họ và tên <span class="required text-destructive aria-hidden" aria-hidden="true">*</span></label>
    <input type="text" id="customer_name" name="customer_name" maxlength="100" required class="w-full h-11 px-3 border border-border rounded-lg text-base text-text bg-white focus-visible:outline-2 focus-visible:outline-offset-0 focus-visible:border-accent" />
  </div>
  <div class="form-field">
    <label for="customer_phone" class="block text-sm font-medium text-text mb-1">Số điện thoại <span class="required text-destructive aria-hidden" aria-hidden="true">*</span></label>
    <input type="tel" id="customer_phone" name="customer_phone" required class="w-full h-11 px-3 border border-border rounded-lg text-base text-text bg-white focus-visible:outline-2 focus-visible:outline-offset-0 focus-visible:border-accent" />
    <p class="help-text text-sm text-gray-500 mt-1">8–11 chữ số, có thể có dấu cách, gạch ngang hoặc dấu cộng</p>
  </div>
  <div class="form-field">
    <label for="customer_address" class="block text-sm font-medium text-text mb-1">Địa chỉ <span class="required text-destructive aria-hidden" aria-hidden="true">*</span></label>
    <textarea id="customer_address" name="customer_address" maxlength="500" required class="w-full min-h-[80px] px-3 border border-border rounded-lg text-base text-text bg-white focus-visible:outline-2 focus-visible:outline-offset-0 focus-visible:border-accent py-2 resize-y"></textarea>
  </div>
  <div class="form-field">
    <label for="customer_note" class="block text-sm font-medium text-text mb-1">Ghi chú (tùy chọn)</label>
    <textarea id="customer_note" name="customer_note" maxlength="1000" placeholder="Ví dụ: giao sau 18h, gọi trước khi đến..." class="w-full min-h-[80px] px-3 border border-border rounded-lg text-base text-text bg-white focus-visible:outline-2 focus-visible:outline-offset-0 focus-visible:border-accent py-2 resize-y"></textarea>
  </div>
  <div class="form-field">
    <button type="submit" class="btn btn-primary w-full sm:w-auto">Đặt hàng</button>
  </div>
</form>
