<header class="site-header sticky top-0 z-10 bg-card border-b border-gray-200">
  <div class="container site-header__inner">
    {% include "_admin_nav.html" %}
    <div class="mobile-search-shell md:ml-auto">
      <button type="button" class="search-toggle btn btn-primary" aria-label="Mở tìm kiếm" aria-expanded="false">
        Tìm kiếm
      </button>
      <form class="search-form flex gap-2 flex-1 max-w-md mx-0 md:ml-auto" role="search" method="get" action="{{ url_for('public.search') }}">
        <label class="visually-hidden" for="search-input">Tìm kiếm</label>
        <input type="search" id="search-input" name="q" placeholder="Tìm sản phẩm…" value="{{ q if q is defined else request.args.get('q', '') }}" class="flex-1 h-11 px-3 border border-border rounded-lg text-base text-text bg-white focus-visible:outline-2 focus-visible:outline-offset-0 focus-visible:border-accent" />
        <button class="btn btn-primary flex-shrink-0" type="submit" aria-label="Tìm kiếm">Tìm</button>
      </form>
      {% if request.endpoint == 'public.search' %}
      <script src="{{ url_for('static', filename='js/search-ajax.js') }}" defer></script>
      {% endif %}
    </div>
    <div class="desktop-header-actions">
      <a class="cart-link text-sm font-semibold text-text hover:text-accent" href="{{ url_for('public.cart') }}">Giỏ hàng
        {% with cart_count = cart_total_quantity %}
          {% if cart_count > 0 %}
          <span class="cart-badge inline-block ml-1 px-2 h-5 bg-accent text-white text-xs font-semibold rounded-full">{{ cart_count }}</span>
          {% else %}
          <span class="cart-badge hidden inline-block ml-1 px-2 h-5 bg-accent text-white text-xs font-semibold rounded-full">0</span>
          {% endif %}
        {% endwith %}
      </a>
      <form class="logout-form" method="post" action="{{ url_for('auth.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" id="logout-button" class="btn btn-secondary">Đăng xuất</button>
      </form>
    </div>
  </div>
  <script>
    document.querySelectorAll('.mobile-search-shell').forEach(function (shell) {
      const toggle = shell.querySelector('.search-toggle');
      const form = shell.querySelector('.search-form');
      const input = shell.querySelector('input[type="search"]');
      if (!toggle || !form || !input) return;

      const closeSearch = function () {
        shell.classList.remove('is-open');
        toggle.setAttribute('aria-expanded', 'false');
      };

      toggle.addEventListener('click', function () {
        const isOpen = shell.classList.contains('is-open');
        shell.classList.toggle('is-open', !isOpen);
        toggle.setAttribute('aria-expanded', String(!isOpen));

        if (!isOpen) {
          setTimeout(function () {
            input.focus();
          }, 50);
        }
      });

      input.addEventListener('blur', function () {
        if (window.innerWidth < 768 && document.activeElement !== toggle && !shell.contains(document.activeElement)) {
          closeSearch();
        }
      });

      form.addEventListener('submit', function () {
        closeSearch();
      });
    });
  </script>
</header>
