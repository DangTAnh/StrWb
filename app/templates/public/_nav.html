<header class="site-header">
  <div class="container site-header__inner">
    {% include "_admin_nav.html" %}
    <div class="mobile-search-shell">
      <button type="button" class="search-toggle" aria-label="Mở tìm kiếm" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg>
      </button>
      <form class="search-form" role="search" method="get" action="{{ url_for('public.search') }}">
        <label class="visually-hidden" for="search-input">Tìm kiếm</label>
        <input type="search" id="search-input" name="q" placeholder="Tìm sản phẩm…" value="{{ q if q is defined else request.args.get('q', '') }}" />
        <button class="btn btn-primary" type="submit" aria-label="Tìm kiếm">Tìm</button>
      </form>
      {% if request.endpoint == 'public.search' %}
      <script src="{{ url_for('static', filename='js/search-ajax.js') }}" defer></script>
      {% endif %}
    </div>
    <div class="desktop-header-actions">
      <a class="cart-link" href="{{ url_for('public.cart') }}">Giỏ hàng
        {% with cart_count = cart_total_quantity %}
          {% if cart_count > 0 %}
          <span class="cart-badge">{{ cart_count }}</span>
          {% else %}
          <span class="cart-badge hidden">0</span>
          {% endif %}
        {% endwith %}
      </a>
      <form class="logout-form" method="post" action="{{ url_for('auth.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" id="logout-button" class="btn btn-secondary">Đăng xuất</button>
      </form>
    </div>
  </div>
  <script>
    document.querySelectorAll('.mobile-search-shell').forEach(function (shell) {
      const toggle = shell.querySelector('.search-toggle');
      const form = shell.querySelector('.search-form');
      const input = shell.querySelector('input[type="search"]');
      if (!toggle || !form || !input) return;

      const closeSearch = function () {
        shell.classList.remove('is-open');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-label', 'Mở tìm kiếm');
      };
      const openSearch = function () {
        shell.classList.add('is-open');
        toggle.setAttribute('aria-expanded', 'true');
        toggle.setAttribute('aria-label', 'Đóng tìm kiếm');
      };

      toggle.addEventListener('click', function () {
        const isOpen = shell.classList.contains('is-open');
        if (isOpen) {
          closeSearch();
        } else {
          openSearch();
          setTimeout(function () {
            input.focus();
          }, 50);
        }
      });

      // Đóng khi bấm ra ngoài shell (mobile). Tap vào nút "Tìm" nằm trong
      // shell → không đóng → submit chạy; submit xong handler dưới tự đóng.
      document.addEventListener('click', function (e) {
        if (window.innerWidth < 768 && shell.classList.contains('is-open') && !shell.contains(e.target)) {
          closeSearch();
        }
      });

      form.addEventListener('submit', function () {
        closeSearch();
      });
    });
  </script>
</header>
