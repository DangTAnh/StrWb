<header class="site-header sticky top-0 z-10 bg-card border-b border-gray-200">
  <div class="container max-w-7xl mx-auto site-header__inner flex flex-col md:flex-row md:items-center md:gap-4 py-2 px-4">
    {% include "_admin_nav.html" %}
    <form class="search-form flex gap-2 flex-1 max-w-md mx-0 md:ml-auto" role="search" method="get" action="{{ url_for('public.search') }}">
      <label class="visually-hidden" for="search-input">Tìm kiếm</label>
      <input type="search" id="search-input" name="q" placeholder="Tìm sản phẩm…" value="{{ q if q is defined else request.args.get('q', '') }}" class="flex-1 h-11 px-3 border border-border rounded-lg text-base text-text bg-white focus-visible:outline-2 focus-visible:outline-offset-0 focus-visible:border-accent" />
      <button class="btn btn-primary flex-shrink-0" type="submit" aria-label="Tìm kiếm">Tìm</button>
    </form>
    <a class="cart-link text-sm font-semibold text-text hover:text-accent" href="{{ url_for('public.cart') }}">Giỏ hàng
      {% with cart_count = session.get('cart', {}) | length %}
        {% if cart_count > 0 %}
        <span class="cart-badge inline-block ml-1 px-2 h-5 bg-accent text-white text-xs font-semibold rounded-full">{{ cart_count }}</span>
        {% endif %}
      {% endwith %}
    </a>
    <form class="logout-form" method="post" action="{{ url_for('auth.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" id="logout-button" class="btn btn-secondary">Đăng xuất</button>
    </form>
  </div>
</header>
