<a class="product-card{% if p.status != 'available' %} is-unavailable{% endif %}"
   href="{{ url_for('public.product_detail', product_id=p.id) }}">
  <div class="product-card-thumb">
    {% if p.primary_image %}
    <img src="{{ url_for('static', filename='uploads/' + p.primary_image.thumb_filename) }}" alt="{{ p.name }}" width="400" height="400" loading="lazy">
    {% else %}
    <span class="product-card-placeholder">—</span>
    {% endif %}
    {% if p.status == 'out_of_stock' %}
    <span class="badge badge-out_of_stock badge-overlay">Hết hàng</span>
    {% elif p.status == 'discontinued' %}
    <span class="badge badge-discontinued badge-overlay">Ngừng bán</span>
    {% endif %}
  </div>
  <div class="product-card-body">
    <h3 class="product-card-name">{{ p.name }}</h3>
    <p class="product-card-price">{{ p.price | format_price }}</p>
  </div>
</a>
