# StoreWeb — nginx site template (reverse proxy + HTTPS + security headers + admin rate limiting)
#
# >>>> THAY YOUR_DOMAIN bằng domain thật trước go-live (D-03) — KHÔNG deploy placeholder. <<<<
#
# Copy vào: /etc/nginx/sites-available/storeweb  rồi symlink vào sites-enabled.
# Sau khi sửa: nginx -t && systemctl reload nginx.
# Cấp SSL TRƯỚC khi nginx -t: certbot certonly --standalone -d YOUR_DOMAIN (tự gia hạn qua certbot.timer) — xem Linux.md §5.

# http level — rate limit zone cho admin (D-04): 10 req/phút/IP
limit_req_zone $binary_remote_addr zone=admin:10m rate=10r/m;
limit_req_status 429;   # trả 429 (không phải 503 mặc định) khi vượt limit — README verify phụ thuộc dòng này (CR-01)

# --- HTTP :80 → redirect toàn bộ sang HTTPS ---
# (ACME dùng `certbot certonly --standalone`, không cần webroot — xem Linux.md §5)
server {
    listen 80;
    server_name YOUR_DOMAIN;

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 ---
server {
    # HTTP/2: dùng tham số `http2` trong listen (tương thích nginx < 1.25.1 — Ubuntu 22.04
    # 1.18, Ubuntu 24.04 1.24, Debian 12 1.22). `http2 on;` (nginx >= 1.25.1) khiến
    # `nginx -t` fail trên các distro đó (WR-01). Trên nginx >= 1.25.1 chỉ cảnh báo deprecated.
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    # Chứng chỉ PHẢI tồn tại TRƯỚC khi nginx -t — cấp bằng `certbot certonly --standalone -d YOUR_DOMAIN` (WR-02, xem Linux.md §5)
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    client_max_body_size 16M;   # khớp MAX_CONTENT_LENGTH (16MB) cho upload ảnh

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static + uploads do nginx phục vụ trực tiếp (CLAUDE.md: static qua nginx)
    location /static/ {
        alias /srv/storewweb/app/static/;
        expires 7d;
        add_header Cache-Control "public";
        # nginx add_header KHÔNG kế thừa từ server khi location tự định nghĩa add_header —
        # phải khai báo lại security headers ở đây (IN-01)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # /login — đích brute-force thật (auth blueprint không url_prefix, route /login) — rate limit (D-04, CR-01)
    location = /login {
        limit_req zone=admin burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /admin — rate limiting + proxy (D-04: chỉ app login, KHÔNG basic auth / allowlist IP)
    location /admin/ {
        limit_req zone=admin burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mọi route động còn lại
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
